<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>F.R.I.E.N.D. Proposal | Executive View</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(90deg, #001f55 0%, #003f8f 50%, #001f55 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(180deg, #003f8f, #002b70);
      padding: 12px 16px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    }
    header h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }
    header p {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .red-line {
      height: 3px;
      background: #d71920;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    img {
      max-width: 100%;
      max-height: calc(100vh - 110px);
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .note {
      text-align: center;
      padding: 12px;
      font-size: 0.85rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <header>
    <h1>F.R.I.E.N.D. Executive Proposal</h1>
    <p>King Soopers / City Market · GPRD 2026</p>
  </header>
  <div class="red-line"></div>
  <main>
    <img src="images/executive-view.png" alt="F.R.I.E.N.D. Executive View" />
  </main>
  <div class="note">
    Executive View · Full interactive version coming soon
  </div>
</body>
</html>
